[package]
name = "clipsa"
version = "0.1.2"
description = "Secure cross-platform clipboard manager"
authors = ["Clipsa contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/mordamax/clipsa"
homepage = "https://clipsa.dev"
keywords = ["clipboard", "manager", "security", "tauri"]
categories = ["gui"]

[lib]
name = "clipsa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# Launch at login for direct builds (LaunchAgent / registry / XDG autostart).
auto-launch = "0.6"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "7"
base64 = "0.23"

# Storage
rusqlite = { version = "0.41", features = ["bundled"] }

# Crypto
aes-gcm = { version = "0.11", features = ["zeroize"] }
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
zeroize = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Clipboard access and paste simulation
arboard = "3.7"
image = { version = "0.25", default-features = false, features = ["png"] }
enigo = "0.6"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6"
# Launch at login via SMAppService (App Store edition only).
objc2-service-management = { version = "0.3", optional = true, default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.100"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Direct-download (GitHub/Homebrew) builds: built-in updater. Enabled by
# tauri.conf.json > build.features.
self-update = ["dep:tauri-plugin-updater"]
# Mac App Store builds (macOS only): sandbox-compatible behaviour (no
# keystroke paste, SMAppService login item). Enabled by
# tauri.appstore.conf.json.
app-store = ["dep:objc2-service-management"]

[dev-dependencies]
tempfile = "3"
