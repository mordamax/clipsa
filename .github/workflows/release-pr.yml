name: Release PR

# Keeps the next release ready as a pull request, then tags it once merged:
#
# 1. release-pr: while .changes/ holds release notes (see .changes/README.md),
#    every push to master rebuilds the branch `release/next` with
#    `covector version` (version bump in src-tauri/Cargo.toml, the notes moved
#    into a dated CHANGELOG.md section, Cargo.lock and the generated site, see
#    scripts/finish-release.mjs) and opens or updates the PR "release: X.Y.Z".
# 2. tag: when master's version has no tag yet and CHANGELOG.md has its dated
#    section (the release PR was merged), it creates the tag vX.Y.Z, which
#    starts the release workflow.
#
# Merging the release PR is the maintainer's approval of the release. Both
# jobs act through a short-lived token of the clipsa-release-bot GitHub App
# (environment `release-pr`, master only): GitHub doesn't run workflows for
# pull requests or tags created with GITHUB_TOKEN, so CI wouldn't check the
# release PR and the tag wouldn't start the release.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-pr:
    name: Update the release PR
    runs-on: ubuntu-latest
    environment: release-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # covector reads the commit that added each note to link its PR.
          fetch-depth: 0

      - name: Any release notes waiting?
        id: notes
        run: |
          if find .changes -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release notes in .changes/; nothing to release."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the release notes
        if: steps.notes.outputs.pending == 'true'
        run: node scripts/check-changes.mjs

      - name: Install pnpm
        if: steps.notes.outputs.pending == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - name: Setup Node
        if: steps.notes.outputs.pending == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # This job pushes what it builds; no caches.
          package-manager-cache: false

      # covector comes from the lockfile (pinned, integrity-checked).
      - name: Install JS dependencies
        if: steps.notes.outputs.pending == 'true'
        run: pnpm install --frozen-lockfile

      # Bumps the version, writes the changelog and runs
      # scripts/finish-release.mjs (date, Cargo.lock, site pages).
      - name: Prepare the release
        if: steps.notes.outputs.pending == 'true'
        id: version
        run: |
          pnpm exec covector version
          version="$(scripts/app-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The release's CHANGELOG section becomes the PR description.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          git status --short

      - name: Get a token for this repository
        if: steps.notes.outputs.pending == 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: mordamax
          repositories: clipsa
          permission-contents: write
          permission-pull-requests: write

      - name: Push release/next and open or update the PR
        if: steps.notes.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -B release/next
          git add -A
          git commit -m "release: $VERSION"
          # The token goes into this one command, not into .git/config.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release/next

          title="release: $VERSION"
          {
            echo "Merging this PR releases Clipsa **$VERSION**: the tag \`v$VERSION\` is created automatically, which builds, signs and publishes the release, updates Homebrew and the website, and starts the Mac App Store build (it waits for approval)."
            echo
            echo "This PR is rebuilt from the notes in \`.changes/\` on every push to master. To change a note, edit or add it in \`.changes/\` through a normal PR."
            echo
            echo "## Release notes"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/body.md"
          number="$(gh pr list -R "$GITHUB_REPOSITORY" --head release/next --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -f title="$title" -F body=@"$RUNNER_TEMP/body.md" --silent
            echo "Updated #$number: $title"
          else
            gh pr create -R "$GITHUB_REPOSITORY" --base master --head release/next --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

  tag:
    name: Tag a merged release
    runs-on: ubuntu-latest
    environment: release-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the release PR changes the version and dates its CHANGELOG
      # section, so this finds exactly the merge of a release PR.
      - name: Is this version released yet?
        id: check
        run: |
          version="$(scripts/app-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version exists; nothing to tag."
            echo "tag=false" >> "$GITHUB_OUTPUT"
          elif grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::src-tauri/Cargo.toml says $version, which has no tag and no dated CHANGELOG.md section. Release versions through the release PR."
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get a token for this repository
        if: steps.check.outputs.tag == 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: mordamax
          repositories: clipsa
          permission-contents: write

      # Created with the App's token, so the tag starts the release workflow.
      - name: Create the tag
        if: steps.check.outputs.tag == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" --silent
          echo "::notice::Tagged $GITHUB_SHA as v$VERSION; the release workflow starts now."
