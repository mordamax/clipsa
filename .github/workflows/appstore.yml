name: Mac App Store

# Builds the sandboxed App Store edition (cargo feature `app-store`, see
# src-tauri/tauri.appstore.conf.json), signs it with the Apple Distribution
# certificate, wraps it in a signed installer package and uploads it to App
# Store Connect, where it shows up in TestFlight after processing.
# The release workflow starts it for every published version tag; it can also
# be run by hand from master (test builds). Every run waits for the
# maintainer's approval: secrets live in the `appstore` environment, which
# requires it and accepts only master and version tags. Submitting and
# releasing a version happen in App Store Connect, which the upload key's
# Developer role can't do. Setup: docs/deployment.md → "Mac App Store".
# Release builds use no caches.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: CFBundleVersion; must be unique per app version in App Store Connect (default = workflow run number)
        required: false
        default: ''
      upload:
        description: Upload to App Store Connect (off = only attach the .pkg to this run)
        type: boolean
        default: true

concurrency:
  group: appstore-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  appstore:
    name: Build, sign and upload
    runs-on: macos-latest
    environment: appstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A version tag must match the app version, like in the release workflow,
      # so a build labelled 0.1.6 is always the code that was released as 0.1.6.
      - name: Check that a tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(scripts/app-version.sh)"
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::The tag $REF_NAME doesn't match the app version $version (src-tauri/Cargo.toml)."
            exit 1
          fi

      - name: Check secrets
        shell: bash
        env:
          APPSTORE_CERTIFICATE: ${{ secrets.APPSTORE_CERTIFICATE }}
          APPSTORE_CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
          APPSTORE_SIGNING_IDENTITY: ${{ secrets.APPSTORE_SIGNING_IDENTITY }}
          APPSTORE_INSTALLER_CERTIFICATE: ${{ secrets.APPSTORE_INSTALLER_CERTIFICATE }}
          APPSTORE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPSTORE_INSTALLER_IDENTITY: ${{ secrets.APPSTORE_INSTALLER_IDENTITY }}
          APPSTORE_PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          required=(
            APPSTORE_CERTIFICATE APPSTORE_CERTIFICATE_PASSWORD APPSTORE_SIGNING_IDENTITY
            APPSTORE_INSTALLER_CERTIFICATE APPSTORE_INSTALLER_CERTIFICATE_PASSWORD APPSTORE_INSTALLER_IDENTITY
            APPSTORE_PROVISIONING_PROFILE APPLE_TEAM_ID
          )
          if [ "$UPLOAD" = "true" ]; then
            required+=(APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_PRIVATE_KEY)
          fi
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets for the App Store build: ${missing[*]}"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # setup-node enables caching on its own when package.json names a
          # package manager; release builds use no caches.
          package-manager-cache: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Write entitlements and provisioning profile
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
        run: |
          sed "s/\$(TEAM_ID)/$APPLE_TEAM_ID/g" src-tauri/appstore/Entitlements.plist.template \
            > src-tauri/appstore/Entitlements.plist
          plutil -lint src-tauri/appstore/Entitlements.plist
          if grep -q 'TEAM_ID' src-tauri/appstore/Entitlements.plist; then
            echo "::error::Entitlements.plist still contains a TEAM_ID placeholder"
            exit 1
          fi
          echo "$APPSTORE_PROVISIONING_PROFILE" | base64 --decode > src-tauri/appstore/embedded.provisionprofile
          security cms -D -i src-tauri/appstore/embedded.provisionprofile > "$RUNNER_TEMP/profile.plist"
          echo "Provisioning profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"

      # Both certificates go into one temporary keychain, together with Apple's
      # WWDR intermediates so the runner can build the chain whatever its image
      # ships. The app is then signed by identity (APPLE_SIGNING_IDENTITY only):
      # Tauri's APPLE_CERTIFICATE import looks identities up by name prefixes
      # ("Apple Distribution:", "Mac App Distribution:", ...) and doesn't find
      # certificates named "3rd Party Mac Developer Application:".
      - name: Import signing certificates
        shell: bash
        env:
          APPSTORE_CERTIFICATE: ${{ secrets.APPSTORE_CERTIFICATE }}
          APPSTORE_CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
          APPSTORE_INSTALLER_CERTIFICATE: ${{ secrets.APPSTORE_INSTALLER_CERTIFICATE }}
          APPSTORE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPSTORE_SIGNING_IDENTITY: ${{ secrets.APPSTORE_SIGNING_IDENTITY }}
          APPSTORE_INSTALLER_IDENTITY: ${{ secrets.APPSTORE_INSTALLER_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/appstore-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for ca in AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG5 AppleWWDRCAG6; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" >/dev/null
          done
          echo "$APPSTORE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" \
            -P "$APPSTORE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          echo "$APPSTORE_INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" \
            -P "$APPSTORE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          rm "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Keep the existing keychains searchable.
          # Each path from `security list-keychains` must be a separate argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Fail here, with a clear message, if either identity isn't usable.
          identities="$(security find-identity -v "$keychain")"
          for identity in "$APPSTORE_SIGNING_IDENTITY" "$APPSTORE_INSTALLER_IDENTITY"; do
            grep -qF "\"$identity\"" <<<"$identities" || {
              echo "::error::Identity not found or not valid in the signing keychain: $identity"
              security find-identity "$keychain"
              exit 1
            }
          done
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # No notarization variables (APPLE_ID, APPLE_API_*) are set here: App
      # Store builds are not notarized.
      - name: Build universal app bundle
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPSTORE_SIGNING_IDENTITY }}
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: |
          pnpm tauri build --bundles app --target universal-apple-darwin \
            --config src-tauri/tauri.appstore.conf.json \
            --config "{\"bundle\":{\"macOS\":{\"bundleVersion\":\"$BUILD_NUMBER\"}}}"

      - name: Verify bundle
        shell: bash
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Clipsa.app"
          codesign --verify --strict --verbose=2 "$app"
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/entitlements.plist"
          plutil -p "$RUNNER_TEMP/entitlements.plist"
          grep -q 'com.apple.security.app-sandbox' "$RUNNER_TEMP/entitlements.plist"
          test -f "$app/Contents/embedded.provisionprofile"
          lipo -info "$app/Contents/MacOS/clipsa"
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleVersion|CFBundleShortVersionString|LSApplicationCategoryType|LSMinimumSystemVersion|ITSAppUsesNonExemptEncryption'

      - name: Build signed installer package
        shell: bash
        env:
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPSTORE_INSTALLER_IDENTITY }}
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Clipsa.app"
          xcrun productbuild --sign "$APPLE_INSTALLER_IDENTITY" --keychain "$SIGNING_KEYCHAIN" \
            --component "$app" /Applications Clipsa.pkg
          pkgutil --check-signature Clipsa.pkg

      - name: Attach package to the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Clipsa-appstore-pkg
          path: Clipsa.pkg
          retention-days: 14

      - name: Upload to App Store Connect
        if: inputs.upload
        shell: bash
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/"AuthKey_${APPSTORE_API_KEY_ID}.p8"
          xcrun altool --upload-app --type macos --file Clipsa.pkg \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Clean up keys
        if: always()
        shell: bash
        run: |
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8 src-tauri/appstore/embedded.provisionprofile
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
