name: Site

# The release list, latest version and date on clipsa.dev are generated from
# CHANGELOG.md by scripts/build-site.mjs and committed. This fails when they
# were not regenerated after a change (run `pnpm site`).
on:
  push:
    branches: [master]
    paths: ['CHANGELOG.md', 'site/**', 'scripts/build-site.mjs']
  pull_request:
    branches: [master]
    paths: ['CHANGELOG.md', 'site/**', 'scripts/build-site.mjs']

permissions:
  contents: read

jobs:
  generated:
    name: Generated pages are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: node scripts/build-site.mjs --check
