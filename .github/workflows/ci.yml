name: CI

# Every pull request runs every job: they are required checks for merging into
# master, and a check that is skipped never reports, which would block the PR.
# Pushes to master (merged PRs) skip the app checks for site/doc-only changes.
on:
  push:
    branches: [master]
    paths-ignore: ['site/**', 'docs/**', '**/*.md', '.vercelignore']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # site/changelog.html and the version on the site are generated from
  # CHANGELOG.md (scripts/build-site.mjs) and committed; this catches a
  # forgotten `pnpm site`.
  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated pages are up to date
        run: node scripts/build-site.mjs --check

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        run: pnpm check

      # tauri::generate_context!() embeds frontendDist (../build), so the
      # directory must exist before cargo clippy/test on a clean checkout.
      - name: Build frontend
        run: pnpm build

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # Three configurations: plain, direct download (self-update), and the
      # Mac App Store edition (macOS only).
      - name: Cargo clippy
        working-directory: src-tauri
        shell: bash
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features self-update -- -D warnings
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo clippy --all-targets --features app-store -- -D warnings
          fi

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --all-targets --features self-update
