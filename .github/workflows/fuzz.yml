name: Fuzz

# Runs the cargo-fuzz targets in src-tauri/fuzz: briefly on pull requests that
# touch the app, longer every week. A crash fails the run and the input that
# caused it is attached as the artifact `fuzz-crashes`.
on:
  pull_request:
    branches: [master]
    paths: ['src-tauri/**', '.github/workflows/fuzz.yml']
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NIGHTLY: nightly-2026-11-20

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && 60 || 600 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-fuzz needs nightly; src-tauri/rust-toolchain.toml selects stable,
      # so cargo is called as `cargo +$NIGHTLY`.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: ${{ env.NIGHTLY }}

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: fuzz

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install cargo-fuzz
        run: cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked

      # Each run starts from the inputs earlier runs found interesting.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      # Every target runs even after another one crashed.
      - name: Fuzz
        working-directory: src-tauri
        run: |
          cargo +"$NIGHTLY" fuzz build
          targets=$(cargo +"$NIGHTLY" fuzz list)
          status=0
          for target in $targets; do
            cargo +"$NIGHTLY" fuzz run "$target" -- -max_total_time="$SECONDS_PER_TARGET" || status=1
          done
          exit "$status"

      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Attach crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: src-tauri/fuzz/artifacts
          if-no-files-found: ignore
