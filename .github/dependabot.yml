version: 2

# One pull request per ecosystem and week, majors included, so updates are
# reviewed and tested together instead of as a stream of single-package PRs.
# If one update in a group can't land yet, keep the rest moving with
# `@dependabot ignore <dependency> major version` (or `minor version`) on the PR.
# Security updates are grouped the same way but arrive as soon as they exist.
# The cooldown skips versions younger than a week, which keeps freshly published
# (and occasionally hijacked) releases out of the build for a while.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # windows-future 0.100 needs windows-core 0.100, but the `windows` crate
      # (0.62, Windows Hello in platform.rs) still uses windows-future 0.3 and no
      # `windows` 0.100 is published. Drop this once it is.
      - dependency-name: windows-future
        versions: ['>=0.100']
    groups:
      cargo:
        patterns: ['*']
      cargo-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 (the native compiler) has no classic compiler API yet:
      # svelte-check (^5 || ^6) and @sveltejs/kit 3 (^6) can't use it. Drop
      # this once both support it.
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      npm:
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
