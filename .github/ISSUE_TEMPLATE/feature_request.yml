name: Feature request
description: Suggest something Clipsa should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation and what gets in your way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Clipsa help?
      description: Your idea, if you have one. Other apps that do it well are useful examples.
  - type: dropdown
    id: platform
    attributes:
      label: Which systems does it matter on?
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
